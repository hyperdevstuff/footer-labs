name: CI

# Free and unlimited on public repositories. Codespaces quota is reserved for
# design work — never run browser tests or builds in the VM.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Generates src/generated/* — must exist before anything reads it.
      - name: Build registry
        run: pnpm registry:build

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate registry
        run: pnpm registry:validate

      - name: Build site
        run: pnpm build
